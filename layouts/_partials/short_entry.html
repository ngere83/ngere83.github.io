<article class="short-entry">
  <p>{{ .Title }}</p>
  <footer class="entry-footer">
    {{- with .CurrentSection }}{{ .Title }}{{ end -}}
    {{- if not .Date.IsZero }} · <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006年1月2日" }}</time>{{ end -}}
  </footer>
</article>
